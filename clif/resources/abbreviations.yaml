# Context-sensitive clinical abbreviations.
#
# prior:  how often the expansion is meant when no context is available.
# cues:   words/stems in the surrounding text that support this expansion.
#
# An abbreviation is resolved only if one expansion reaches the dominance
# threshold (CLIF_ABBREVIATION_DOMINANCE, default 0.9) after combining prior
# and context cues. Otherwise the mapping is returned as AMBIGUOUS.

