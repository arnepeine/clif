name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Demo end to end
        run: |
          clif demo-release data/rf2
          python -m clif.import_rf2 data/rf2/SnomedCT_ClifDemoRF2_PRODUCTION_20250101T120000Z
          python -m clif.build_index
          clif evaluate data/eval/demo_eval.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t clif:ci .
